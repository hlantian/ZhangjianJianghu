server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: zhangjian-jianghu
  datasource:
    url: jdbc:mysql://localhost:3306/zhangjian_jianghu?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: zjjh123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.zjjh.mud.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: zhangjian-jianghu-secret-key-2024-very-long-for-hmac-sha256
  expiration: 86400000  # 24小时(毫秒)
  header: Authorization
  prefix: "Bearer "

# 游戏配置
game:
  # 原始数据路径(用于数据迁移)
  data-path: e:/ZhangjianJianghu/home/mud/data
  # 房间内移动坐标范围
  min-x: 10
  max-x: 365
  min-y: 90
  max-y: 320
  # 浏览器超时(秒)
  browser-timeout: 60
  # 发呆时间(毫秒)
  idle-time: 500000
  # 掉线时间(毫秒)
  offline-time: 900000
  # 身体恢复速度(毫秒)
  body-recovery: 30000
  # 食品消耗时间(毫秒)
  food-consume-time: 60000
  # 战斗间隔(毫秒)
  combat-interval: 5000
  # 食品消耗量
  food-consume: 2
  # 年龄增长速度(毫秒)
  age-growth: 86400000
  # 晕倒时间(毫秒)
  faint-time: 20000
  # 逃跑机会
  escape-chance: 20
  # 新手开始年龄
  newbie-age: 14
  # 新手开始气血
  newbie-body: 100
  # 初始食物饮水
  newbie-food: 150
  newbie-drink: 150

logging:
  level:
    com.zjjh.mud: debug
    org.springframework.web.socket: info
