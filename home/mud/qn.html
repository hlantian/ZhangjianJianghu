<SCRIPT language=JavaScript type=""> 
function CalcIt() 
{ 
a=parseInt(document.MYFORM.WuXing.value); 
b=parseInt(document.MYFORM.JiBie.value); 
c=parseInt(document.MYFORM.CiShu.value);
if (c >= 500){
a=a+a/2;
}
a1=a*2; 
str=""; 
for(i=0;i<10;i++) 
{ 
var q1 = (b+i)*(b+i)*10/a1;
q1 = Math.ceil(q1);
var q2 = (b+i)*(b+i)*10/a;
q2 = Math.ceil(q2);
str += (b+i) + " min: " + parseInt(q1)+",max:"+ parseInt(q2); 
str += "\n"; 
} 
document.MYFORM.MSG123.value = str; 

return true; 
} ; 
</script>
<form method="POST" name="MYFORM" ID="Form1">

<br><br>次数：<input type="text" name="CiShu" size="20" ID="Text3">&nbsp;&nbsp;&nbsp;
<input type="button" value="统计" name="B1" onClick="return CalcIt();" ID="Button1"></p>
